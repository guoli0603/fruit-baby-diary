<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="果粒辅食日记">
<meta name="theme-color" content="#FF8C00">
<title>果粒辅食日记</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html{height:100%;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#FFF8F0;
  height:100%;
  overflow:hidden;
}

/* ================================================================
   DESKTOP LAYOUT — 28% left + 72% right
   ================================================================ */
.desktop-layout{display:flex;height:100%}

/* ---- Sidebar (desktop only) ---- */
.sidebar{
  width:28%;min-width:220px;max-width:280px;
  background:linear-gradient(180deg,#FF8C00 0%,#FF6D00 40%,#FF9800 100%);
  display:flex;flex-direction:column;padding:24px 0;
  box-shadow:2px 0 16px rgba(0,0,0,0.1);
  flex-shrink:0;
}
.sidebar-header{padding:0 20px 20px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.2);margin-bottom:8px}
.sidebar-header .logo{font-size:36px;display:block;margin-bottom:2px}
.sidebar-header h1{font-size:20px;color:#FFF;font-weight:700;letter-spacing:1px}
.sidebar-header .subtitle{font-size:11px;color:rgba(255,255,255,0.7);margin-top:4px}

.nav-menu{flex:1;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;
  cursor:pointer;transition:all 0.25s;color:rgba(255,255,255,0.85);
  font-size:15px;font-weight:500;border:none;background:transparent;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,0.12);color:#FFF}
.nav-item .nav-icon{font-size:22px;width:32px;text-align:center;flex-shrink:0}
.nav-item.active{background:#43A047;color:#FFF;font-weight:600;box-shadow:0 3px 10px rgba(67,160,71,0.35)}

.sidebar-footer{padding:12px 20px;font-size:11px;color:rgba(255,255,255,0.5);text-align:center;border-top:1px solid rgba(255,255,255,0.15)}

/* ---- Content (desktop) ---- */
.main-content{width:72%;flex:1;padding:28px 32px;overflow-y:auto;background:#FFF8F0}

/* ================================================================
   MOBILE LAYOUT — top header + full content + bottom tab bar
   ================================================================ */
.mobile-layout{display:none;flex-direction:column;height:100%}

/* Top header bar */
.mobile-header{
  background:linear-gradient(135deg,#FF8C00,#FF6D00);
  color:#FFF;padding:12px 16px;display:flex;align-items:center;gap:10px;
  flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.1);
  padding-top:max(12px, env(safe-area-inset-top))
}
.mobile-header .m-logo{font-size:28px;line-height:1}
.mobile-header .m-title{font-size:17px;font-weight:700;flex:1}
.mobile-header .m-subtitle{font-size:11px;opacity:0.75;margin-top:1px}

/* Main scroll area */
.mobile-main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}

/* Bottom tab bar */
.bottom-tabs{
  display:flex;background:#FFF;border-top:1px solid #EEE;
  padding-bottom:max(4px, env(safe-area-inset-bottom));
  flex-shrink:0;box-shadow:0 -2px 8px rgba(0,0,0,0.04);
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 4px 6px;border:none;background:transparent;cursor:pointer;
  color:#999;font-size:10px;font-weight:500;transition:all 0.2s;
  -webkit-tap-highlight-color:transparent;min-height:56px;
}
.tab-btn .tab-icon{font-size:22px;margin-bottom:2px;line-height:1}
.tab-btn.active{color:#FF8C00}
.tab-btn.active .tab-icon{transform:scale(1.1)}

/* ================================================================
   SHARED STYLES
   ================================================================ */
.card{
  background:#FFF;border-radius:20px;padding:24px;margin-bottom:16px;
  box-shadow:0 2px 14px rgba(0,0,0,0.04);
}
.section-title{font-size:20px;font-weight:700;color:#333;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.section-title .icon{font-size:24px}

/* ---- Buttons ---- */
.btn{
  padding:10px 20px;border-radius:24px;border:none;cursor:pointer;
  font-size:14px;font-weight:600;transition:all 0.2s;
  display:inline-flex;align-items:center;gap:6px;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(0.96)}
.btn-orange{background:#FF8C00;color:#FFF}
.btn-orange:active{background:#F57C00}
.btn-outline{background:#FFF;color:#FF8C00;border:2px solid #FF8C00}
.btn-outline:active{background:#FFF3E0}
.btn-green{background:#43A047;color:#FFF}
.btn-green:active{background:#388E3C}

/* ---- Meal Cards ---- */
.meal-cards{display:grid;grid-template-columns:repeat(3, 1fr);gap:16px}
.meal-card{
  background:#FAFAFA;border-radius:16px;padding:20px;
  border:2px solid #F0F0F0;transition:all 0.25s;
  position:relative;overflow:hidden;
}
.meal-card.breakfast{border-left:5px solid #FFB74D}
.meal-card.lunch{border-left:5px solid #66BB6A}
.meal-card.dinner{border-left:5px solid #42A5F5}
.meal-time{font-size:12px;font-weight:700;margin-bottom:8px}
.meal-time.breakfast-tag{color:#F57C00}
.meal-time.lunch-tag{color:#2E7D32}
.meal-time.dinner-tag{color:#1565C0}
.meal-name{font-size:17px;font-weight:700;color:#333;margin-bottom:10px;line-height:1.3}
.meal-ingredients{font-size:13px;color:#666;margin-bottom:8px;line-height:1.5}
.meal-method{display:inline-block;font-size:11px;color:#999;background:#F5F5F5;padding:3px 10px;border-radius:10px}
.tag-highlight{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;margin-right:4px}
.tag-fish{background:#B3E5FC;color:#0277BD}
.tag-shrimp{background:#FFCDD2;color:#C62828}
.tag-egg{background:#FFF9C4;color:#F57F17}
.tag-beef{background:#FFCCBC;color:#BF360C}

/* ---- Random Banner ---- */
.random-banner{
  background:linear-gradient(135deg,#FFF3E0,#FFE0B2);
  border-radius:16px;padding:18px 20px;margin-bottom:18px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
}
.random-banner .banner-text{font-size:15px;font-weight:600;color:#E65100}
.random-banner .banner-sub{font-size:12px;color:#BF360C;margin-top:2px}

/* ---- Week Table ---- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.week-table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.week-table th{background:#FF8C00;color:#FFF;padding:10px 8px;font-weight:600;font-size:12px;white-space:nowrap}
.week-table th:first-child{border-radius:10px 0 0 0}
.week-table th:last-child{border-radius:0 10px 0 0}
.week-table td{padding:8px;border-bottom:1px solid #F0F0F0;vertical-align:top;line-height:1.4;font-size:12px}
.week-table .day-cell{font-weight:700;color:#FF8C00;background:#FFF3E0;text-align:center;font-size:12px}

/* ---- Tracking ---- */
.track-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.track-stat{background:#FAFAFA;border-radius:14px;padding:16px 8px;text-align:center;border:2px solid #F0F0F0}
.track-stat .stat-icon{font-size:26px}
.track-stat .stat-count{font-size:26px;font-weight:800;color:#FF8C00;margin:2px 0}
.track-stat .stat-label{font-size:12px;color:#666}
.track-stat .stat-status{font-size:10px;margin-top:2px;color:#43A047;font-weight:600}

.track-table{width:100%;border-collapse:collapse;text-align:center;min-width:560px}
.track-table th{background:#FF8C00;color:#FFF;padding:10px 6px;font-size:12px}
.track-table td{padding:12px 6px;border-bottom:1px solid #F0F0F0;font-size:13px}
.track-table .check{color:#43A047;font-weight:700;font-size:15px}
.track-table .dash{color:#BDBDBD}
.track-table .cat-cell{text-align:left;font-weight:600;padding-left:12px}
.track-table .count-cell{font-weight:700;color:#FF8C00;font-size:15px}
.track-table .status-pass{color:#43A047;font-weight:600}
.track-table .status-fail{color:#F44336;font-weight:600}

/* ---- Shopping ---- */
.shop-category{margin-bottom:20px}
.shop-cat-title{font-size:15px;font-weight:700;color:#333;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid #FFE0B2;display:flex;align-items:center;gap:8px}
.shop-cat-title .cat-icon{font-size:18px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.shop-item{
  background:#FFF;border:1px solid #F0F0F0;border-radius:12px;
  padding:12px 14px;display:flex;justify-content:space-between;align-items:center;
}
.shop-item .item-name{font-size:13px;font-weight:500;color:#333}
.shop-item .item-qty{font-size:12px;color:#999}

/* Tips grid */
.tips-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

/* Content panels */
.content-panel{display:none}
.content-panel.active{display:block;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ================================================================
   RESPONSIVE — Mobile vs Desktop
   ================================================================ */
@media (max-width:768px){
  .desktop-layout{display:none}
  .mobile-layout{display:flex}
}
@media (min-width:769px){
  .desktop-layout{display:flex}
  .mobile-layout{display:none}
}

/* Mobile-specific overrides */
@media (max-width:768px){
  .meal-cards{grid-template-columns:1fr;gap:12px}
  .meal-card{padding:16px;border-radius:14px}
  .meal-name{font-size:16px}
  .card{padding:18px;border-radius:16px;margin-bottom:12px}
  .section-title{font-size:18px;margin-bottom:14px}
  .section-title .icon{font-size:22px}
  .track-summary{grid-template-columns:repeat(2,1fr);gap:8px}
  .track-stat{padding:12px 6px;border-radius:12px}
  .track-stat .stat-icon{font-size:22px}
  .track-stat .stat-count{font-size:22px}
  .random-banner{padding:14px 16px;border-radius:14px}
  .random-banner .banner-text{font-size:14px}
  .random-banner .banner-sub{font-size:11px}
  .btn{padding:10px 16px;font-size:13px}
  .shop-grid{grid-template-columns:1fr}
  .tips-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ==================== DESKTOP LAYOUT ==================== -->
<div class="desktop-layout" id="desktop-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo">🍊</span>
      <h1>果粒辅食日记</h1>
      <p class="subtitle">宝宝每日辅食工作台</p>
    </div>
    <nav class="nav-menu" id="desktop-nav"></nav>
    <div class="sidebar-footer">果粒辅食日记 v2.0 · 科学喂养</div>
  </aside>
  <main class="main-content" id="desktop-content"></main>
</div>

<!-- ==================== MOBILE LAYOUT ==================== -->
<div class="mobile-layout" id="mobile-layout">
  <header class="mobile-header">
    <span class="m-logo">🍊</span>
    <div>
      <div class="m-title">果粒辅食日记</div>
      <div class="m-subtitle">宝宝每日辅食工作台</div>
    </div>
  </header>
  <main class="mobile-main" id="mobile-content"></main>
  <nav class="bottom-tabs" id="mobile-tabs"></nav>
</div>

<script>
// ====================== DATA ======================
const weeklyPlan = [
  { day:"周一", meals:[
    { time:"早餐", name:"馒头 + 小米南瓜米糊", ing:"婴儿馒头、小米、南瓜", method:"蒸+煮", note:"松软馒头锻炼咀嚼，南瓜米糊暖胃，干湿搭配", tag:"" },
    { time:"午餐", name:"鳕鱼蔬菜烩饭", ing:"鳕鱼🐟、胡萝卜、洋葱、软米饭", method:"烩", note:"鳕鱼DHA促大脑发育，烩饭粒粒分明练咀嚼", tag:"fish" },
    { time:"晚餐", name:"番茄牛肉软面", ing:"牛肉🥩、番茄、婴儿面条", method:"炖煮", note:"牛肉补铁，番茄维C促进铁吸收", tag:"beef" }
  ]},
  { day:"周二", meals:[
    { time:"早餐", name:"鸡蛋羹 + 燕麦核桃米糊", ing:"鸡蛋🥚、燕麦、核桃碎", method:"蒸+煮", note:"蛋羹嫩滑，燕麦核桃米糊补脑，干湿搭配", tag:"egg" },
    { time:"午餐", name:"鲜虾西兰花烩饭", ing:"鲜虾🦐、西兰花、软米饭", method:"烩", note:"虾富含优质蛋白和锌", tag:"shrimp" },
    { time:"晚餐", name:"蛋黄菠菜软饼", ing:"鸡蛋🥚、菠菜、面粉", method:"烙", note:"软饼锻炼手抓咀嚼，蛋黄补卵磷脂", tag:"egg" }
  ]},
  { day:"周三", meals:[
    { time:"早餐", name:"玉米山药软饼 + 紫薯小米糊", ing:"玉米、山药、面粉、紫薯、小米", method:"烙+煮", note:"软饼练咀嚼，紫薯花青素满满，干湿搭配", tag:"" },
    { time:"午餐", name:"牛肉土豆烩饭", ing:"牛肉🥩、土豆、青菜、软米饭", method:"烩", note:"土豆提供碳水，牛肉补铁", tag:"beef" },
    { time:"晚餐", name:"龙利鱼豆腐饭团", ing:"龙利鱼🐟、嫩豆腐、软米饭", method:"蒸", note:"饭团锻炼手抓，龙利鱼无刺安全", tag:"fish" }
  ]},
  { day:"周四", meals:[
    { time:"早餐", name:"苹果山药蒸糕 + 红枣花生米糊", ing:"苹果、山药、鸡蛋🥚、面粉、红枣、花生", method:"蒸+煮", note:"蒸糕松软香甜，红枣花生米糊补铁，干湿搭配", tag:"egg" },
    { time:"午餐", name:"鲜虾胡萝卜软面", ing:"鲜虾🦐、胡萝卜、婴儿面条", method:"炖煮", note:"胡萝卜补维A，虾补锌", tag:"shrimp" },
    { time:"晚餐", name:"鸡胸肉南瓜烩饭", ing:"鸡胸肉、南瓜、软米饭", method:"烩", note:"鸡胸肉高蛋白低脂，南瓜香甜", tag:"" }
  ]},
  { day:"周五", meals:[
    { time:"早餐", name:"南瓜红枣软饼 + 核桃黑芝麻米糊", ing:"南瓜、红枣、面粉、核桃、黑芝麻、大米", method:"烙+煮", note:"软饼香甜，黑芝麻补钙健脑，干湿搭配", tag:"" },
    { time:"午餐", name:"三文鱼菠菜饭团", ing:"三文鱼🐟、菠菜、软米饭", method:"蒸", note:"三文鱼Omega-3，饭团锻炼抓握咬合", tag:"fish" },
    { time:"晚餐", name:"牛肉番茄意面", ing:"牛肉🥩、番茄、婴儿意面", method:"炖煮", note:"牛肉补铁补锌，意面有嚼劲", tag:"beef" }
  ]},
  { day:"周六", meals:[
    { time:"早餐", name:"紫薯核桃饭团 + 山药红枣米糊", ing:"紫薯、核桃碎、软米饭、山药、红枣", method:"蒸+煮", note:"饭团锻炼手抓，山药红枣健脾暖身，干湿搭配", tag:"" },
    { time:"午餐", name:"鲜虾冬瓜烩饭", ing:"鲜虾🦐、冬瓜、软米饭", method:"烩", note:"冬瓜利水消暑，烩饭有嚼劲", tag:"shrimp" },
    { time:"晚餐", name:"鳕鱼胡萝卜烩饭", ing:"鳕鱼🐟、胡萝卜、软米饭", method:"烩", note:"鳕鱼DHA+胡萝卜维A", tag:"fish" }
  ]},
  { day:"周日", meals:[
    { time:"早餐", name:"黑米黑芝麻软饼 + 南瓜小米糊", ing:"黑米粉、黑芝麻、面粉、南瓜、小米", method:"烙+煮", note:"黑芝麻补钙，南瓜护眼，干湿搭配", tag:"" },
    { time:"午餐", name:"牛肉山药烩饭", ing:"牛肉🥩、山药、青菜、软米饭", method:"烩", note:"山药健脾，牛肉补铁", tag:"beef" },
    { time:"晚餐", name:"虾仁蛋饼", ing:"鲜虾🦐、鸡蛋🥚、面粉", method:"烙", note:"双重蛋白，烙饼锻炼咀嚼", tag:"shrimp_egg" }
  ]}
];

const NAV_ITEMS = [
  { id:'daily',   icon:'🍽️', label:'每日辅食' },
  { id:'weekly',  icon:'📅', label:'周计划' },
  { id:'tracking',icon:'📊', label:'营养追踪' },
  { id:'ingredients',icon:'📦', label:'食材库' },
  { id:'shopping',icon:'🛒', label:'采购清单' }
];

let currentPanel = 'daily';

// ====================== NAVIGATION BUILDER ======================
function buildDesktopNav() {
  const nav = document.getElementById('desktop-nav');
  nav.innerHTML = NAV_ITEMS.map(item => `
    <button class="nav-item${item.id===currentPanel?' active':''}" data-panel="${item.id}">
      <span class="nav-icon">${item.icon}</span> ${item.label}
    </button>
  `).join('');

  nav.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => switchPanel(btn.dataset.panel));
  });
}

function buildMobileTabs() {
  const tabs = document.getElementById('mobile-tabs');
  tabs.innerHTML = NAV_ITEMS.map(item => `
    <button class="tab-btn${item.id===currentPanel?' active':''}" data-panel="${item.id}">
      <span class="tab-icon">${item.icon}</span>
      ${item.label}
    </button>
  `).join('');

  tabs.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchPanel(btn.dataset.panel));
  });
}

function switchPanel(panelId) {
  currentPanel = panelId;

  // Update desktop nav
  document.querySelectorAll('#desktop-nav .nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.panel === panelId);
  });

  // Update mobile tabs
  document.querySelectorAll('#mobile-tabs .tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.panel === panelId);
  });

  // Render content in both desktop and mobile
  renderContent('desktop-content', panelId);
  renderContent('mobile-content', panelId);

  // Scroll mobile to top
  document.getElementById('mobile-content').scrollTop = 0;
}

// ====================== CONTENT RENDERER ======================
function renderContent(containerId, panelId) {
  const c = document.getElementById(containerId);
  if (!c) return;

  let html = '';
  switch(panelId) {
    case 'daily':      html = renderDaily(); break;
    case 'weekly':     html = renderWeeklyPanel(); break;
    case 'tracking':   html = renderTrackingPanel(); break;
    case 'ingredients':html = renderIngredientsPanel(); break;
    case 'shopping':   html = renderShoppingPanel(); break;
  }
  c.innerHTML = html;

  // Attach shuffle button listeners
  if (panelId === 'daily') {
    c.querySelectorAll('.btn-shuffle').forEach(btn => {
      btn.addEventListener('click', () => {
        // Refresh both panels
        renderContent('desktop-content', 'daily');
        renderContent('mobile-content', 'daily');
        const mc = document.getElementById('mobile-content');
        if (mc) mc.scrollTop = 0;
      });
    });
  }
}

// ---- DAILY MEALS ----
function getRandomPair() {
  const allMeals = [];
  weeklyPlan.forEach(d => d.meals.forEach(m => allMeals.push({...m, day:d.day})));

  const breakfasts = allMeals.filter(m => m.time==='早餐');
  const nonBreakfasts = allMeals.filter(m => m.time!=='早餐');

  let selected = [];
  selected.push(breakfasts[Math.floor(Math.random()*breakfasts.length)]);

  const tagsNeeded = ['fish','shrimp','egg','beef'];
  let remain = [...nonBreakfasts].sort(()=>Math.random()-0.5);

  for (const tag of tagsNeeded) {
    if (selected.length>=3) break;
    const idx = remain.findIndex(m => m.tag.includes(tag));
    if (idx>=0) selected.push(remain.splice(idx,1)[0]);
  }
  while (selected.length<3 && remain.length>0) selected.push(remain.shift());
  while (selected.length<3) {
    const r = Math.floor(Math.random()*nonBreakfasts.length);
    if (!selected.find(s=>s.name===nonBreakfasts[r].name)) selected.push(nonBreakfasts[r]);
  }
  selected.sort(()=>Math.random()-0.5);
  return selected.slice(0,3);
}

// ---- TRACKING ----
function renderTrackingPanel() {
  const tags = [
    { name:'鱼', icon:'🐟', cls:'fish' },
    { name:'虾', icon:'🦐', cls:'shrimp' },
    { name:'鸡蛋', icon:'🥚', cls:'egg' },
    { name:'牛肉', icon:'🥩', cls:'beef' }
  ];

  const tracking = tags.map(t => {
    const row = weeklyPlan.map(d => d.meals.some(m => m.tag.includes(t.cls)));
    const count = row.filter(Boolean).length;
    return {...t, row, count, pass:count>=2};
  });

  const days = ['周一','周二','周三','周四','周五','周六','周日'];

  const statsHtml = tracking.map(t => `
    <div class="track-stat">
      <div class="stat-icon">${t.icon}</div>
      <div class="stat-count">${t.count}<span style="font-size:13px;font-weight:400;">/7天</span></div>
      <div class="stat-label">${t.name}</div>
      <div class="stat-status">${t.pass?'✅ 达标':'⚠️ 不足'}</div>
    </div>
  `).join('');

  let tableHtml = `<table class="track-table"><thead><tr>
    <th>食材</th><th></th>${days.map(d=>`<th>${d}</th>`).join('')}
    <th>次数</th><th>状态</th>
  </tr></thead><tbody>`;

  tracking.forEach(t => {
    tableHtml += `<tr>
      <td class="cat-cell">${t.name}</td><td>${t.icon}</td>
      ${t.row.map(h=>`<td class="${h?'check':'dash'}">${h?'✓':'—'}</td>`).join('')}
      <td class="count-cell">${t.count}次</td>
      <td class="${t.pass?'status-pass':'status-fail'}">${t.pass?'✅ 达标':'⚠️ 不足'}</td>
    </tr>`;
  });

  tableHtml += `<tr style="background:#FFF3E0;font-weight:600;">
    <td colspan="2">每日覆盖</td>
    ${days.map((_,di)=>{
      const cnt = tracking.filter(t=>t.row[di]).length;
      return `<td style="color:#FF8C00;font-size:15px;">${cnt}</td>`;
    }).join('')}
    <td style="color:#FF8C00;font-size:15px;">${tracking.reduce((s,t)=>s+t.count,0)}</td>
    <td>—</td>
  </tr></tbody></table>`;

  return `<div class="card">
    <div class="section-title"><span class="icon">📊</span> 每周关键食材覆盖</div>
    <div class="track-summary">${statsHtml}</div>
    <div class="table-wrap">${tableHtml}</div>
    <p style="margin-top:14px;font-size:12px;color:#999;">💡 每种关键食材每周建议至少食用2次以上</p>
  </div>`;
}
